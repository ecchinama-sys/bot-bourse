name: Bot Bourse Minuit

on:
  schedule:
    - cron: '0 0 * * *' # S'exécute tous les jours à 00:00 UTC
  workflow_dispatch: # Permet de le lancer manuellement quand tu veux pour tester

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        run: python bot.py
